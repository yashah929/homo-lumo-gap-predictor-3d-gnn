[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qm9-gap-gnn"
version = "0.1.0"
description = "Three-dimensional message-passing neural network for the QM9 HOMO-LUMO gap"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Project contributors"}]
dependencies = [
  "torch>=2.2",
  "torch-geometric>=2.5",
  "rdkit>=2023.9",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
